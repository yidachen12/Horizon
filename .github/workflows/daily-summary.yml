name: Daily Horizon Summary

on:
  # Daily scheduling is handled by a local Windows Task Scheduler job
  # ("Horizon 游戏音效早报", runs run-horizon.ps1 at 10:00) because
  # GitHub's cron is unreliable. This workflow is kept for manual runs.
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write  # Needed to commit changes
    env:
      # Pin uv to the system Python that's already installed on this
      # Windows machine; uv's managed Python install relies on symbolic
      # links which non-admin users can't create on Windows without
      # Developer Mode. Using the existing interpreter sidesteps that
      # whole problem.
      UV_PYTHON: "C:\\Users\\chenyida\\AppData\\Local\\Programs\\Python\\Python312\\python.exe"
      UV_PYTHON_PREFERENCE: only-system

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Debug YouTube reachability from runner
        shell: powershell
        run: |
          $url = "https://www.youtube.com/feeds/videos.xml?channel_id=UCuv_-Z-CrnYup-N_dVpdCYg"
          try {
            $r = Invoke-WebRequest -Uri $url -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" -TimeoutSec 15
            "PowerShell IWR status: $($r.StatusCode), bytes: $($r.RawContentLength)"
          } catch {
            "PowerShell IWR error: $($_.Exception.Message)"
          }
          curl.exe -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" -o NUL -w "curl HTTP %`{http_code`} `n" $url
          whoami
          ipconfig /all | findstr /R "IPv4 DNS"

      - name: Run Horizon
        env:
          # Lilith internal LLM proxy (OpenAI-compatible) — see data/config.json
          LILITH_LLM_KEY: ${{ secrets.LILITH_LLM_KEY }}
          # Feishu group robot incoming webhook URL — see data/config.json
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          # Force Python stdout to UTF-8; default code page on Chinese
          # Windows is GBK and rich emojis (🌅 ❌ etc.) crash with
          # UnicodeEncodeError.
          PYTHONIOENCODING: "utf-8"
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        shell: powershell
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
