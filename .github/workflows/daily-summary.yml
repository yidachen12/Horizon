name: Daily Horizon Summary

on:
  schedule:
    # 23:00 UTC = 07:00 Asia/Shanghai (Beijing), daily
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Horizon
        env:
          # Lilith internal LLM proxy (OpenAI-compatible) — see data/config.json
          LILITH_LLM_KEY: ${{ secrets.LILITH_LLM_KEY }}
          # Feishu group robot incoming webhook URL — see data/config.json
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          "DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
